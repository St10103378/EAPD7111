version: "3.9"

services:

  # ---------------- SQL SERVER ----------------
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    networks:
      - glms-network
    volumes:
      - sql_data:/var/opt/mssql

  glms-backend-api:
    build:
      context: ./GLMS.Backend.Api
      dockerfile: Dockerfile
    container_name: glms-backend-api
    depends_on:
      - sql-server-db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sql-server-db;Database=GLMS;User Id=sa;Password=2025!Passw0rd;TrustServerCertificate=True;"
    ports:
      - "5066:8080"
    networks:
      - glms-network

  frontend:
    build:
      context: ./Logistics
      dockerfile: Dockerfile
    container_name: glms-frontend
    depends_on:
      - glms-backend-api
    environment:
      ApiBaseUrl: "http://glms-backend-api:8080/"
    ports:
      - "5000:8080"
    networks:
      - glms-network

networks:
  glms-network:
    driver: bridge

volumes:
  sql_data: